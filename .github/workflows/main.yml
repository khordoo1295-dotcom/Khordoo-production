name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract project
        shell: bash
        run: |
          set -euxo pipefail

          ZIP_FILE="$(find . -maxdepth 2 -type f -name 'production_wage_app_v1_1.zip' | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: production_wage_app_v1_1.zip not found"
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          mkdir -p project
          unzip -o "$ZIP_FILE" -d project

          echo "=== Project files ==="
          find project -maxdepth 4 -type f | sort

          GRADLEW="$(find project -type f -name gradlew | head -n 1)"

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew was not found in the extracted project."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$GRADLEW")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "=== Android project ==="
          ls -la "$PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euxo pipefail

          chmod +x gradlew

          echo "=== Gradle version ==="
          ./gradlew --version

          echo "=== Building APK ==="
          ./gradlew assembleDebug --stacktrace --info

      - name: Find APK
        if: success()
        run: |
          echo "=== APK files ==="
          find "$PROJECT_DIR" -type f -name "*.apk" -print

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Khordoo-Production-APK
          path: ${{ env.PROJECT_DIR }}/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
